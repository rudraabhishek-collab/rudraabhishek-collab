name: contribution snake
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23111111&color_dots=%23ebebeb,%23c8c8c8,%239a9a9a,%236a6a6a,%23333333&color_dot_border=%23ffffff
            dist/github-snake-dark.svg?color_snake=%23ffffff&color_dots=%23161616,%23333333,%23666666,%23999999,%23e6e6e6&color_dot_border=%230b0b0b
      - uses: crazy-max/ghaction-github-pages@v3.3.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
