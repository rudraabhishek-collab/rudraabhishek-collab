name: contribution snake
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23111111&color_dots=%23ebebeb,%23c8c8c8,%239a9a9a,%236a6a6a,%23333333&color_dot_border=%23ffffff
            dist/github-snake-dark.svg?color_snake=%23ffffff&color_dots=%23161616,%23333333,%23666666,%23999999,%23e6e6e6&color_dot_border=%230b0b0b
      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "snake: update"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
